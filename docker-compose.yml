services:
  forge-bot:
    build: .
    container_name: forge-bot
    restart: unless-stopped
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Docker-in-Docker connection
      - DOCKER_HOST=tcp://dind:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client/client
    volumes:
      - forge-data:/data
      - dind-certs:/certs/client:ro
    depends_on:
      dind:
        condition: service_healthy

  dind:
    image: docker:27-dind
    container_name: forge-bot-dind
    privileged: true
    restart: unless-stopped
    environment:
      - DOCKER_TLS_CERTDIR=/certs
      - DOCKER_TLS_SAN=DNS:dind
    volumes:
      - dind-certs:/certs
      - dind-storage:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  forge-data:
  dind-certs:
  dind-storage:
